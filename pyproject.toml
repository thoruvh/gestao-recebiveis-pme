[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestao-recebiveis-pme"
version = "0.1.0"
description = "Pipeline e painel de recebíveis e inadimplência para PMEs (aging, roll rate, safras, perda esperada e previsão de caixa)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.20",
    "pyarrow>=15",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
